plugins {
    id 'java'
}

group = 'io.github.pluginprofiler'
version = '1.0.0'

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex 'net\\.runelite.*' }
    }
    mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('1.13.7')

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') { into 'META-INF' }
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.pluginprofiler.DevelopmentClient'
    enableAssertions = true
    args '--developer-mode'
}
